<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Generate speculative, participatory, more-than-human lorem ipsum. Paste a text and see its vocabulary light up a hopecore bingo card.">
<link rel="icon" href="data:,">
<title>Carem Ipsum – Hopecore Bingo</title>
<link rel="stylesheet" href="style.css"><script type="module" src="app.mjs"></script>
</head>
<body>
<header><a class="wordmark" href="#">carem ipsum</a></header>
<main>
<section class="intro"><div><h1>Co-creating<br><em>possible worlds.</em></h1></div><div class="seal" aria-hidden="true"><span>100%<br>MORE THAN<br><b>HUMAN</b></span></div></section>
<section class="workspace" aria-label="Hopecore generator and bingo checker">
<div class="writing">
<div class="tabs" role="tablist" aria-label="Text mode"><button id="generate-tab" role="tab" aria-selected="true" aria-controls="generate-panel">Make some hopecore</button><button id="check-tab" role="tab" aria-selected="false" aria-controls="check-panel" tabindex="-1">Check a text</button></div>
<section id="generate-panel" role="tabpanel" aria-labelledby="generate-tab">
<div class="controls"><label>The occasion<select id="register"></select></label><label>Paragraphs<select id="paragraphs"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label></div>
<div class="controls world-controls"><label>The world<select id="theme"></select></label><label>Jargon level<select id="density"></select></label></div>
<div id="generated" class="generated" aria-label="Generated hopecore"></div>
<div class="actions"><button id="generate" class="primary">Reimagine it ↗</button><button id="copy" class="secondary">Copy text</button></div>

</section>
<section id="check-panel" role="tabpanel" aria-labelledby="check-tab" hidden>
<label class="input-label" for="input">Paste an abstract, manifesto, workshop invitation…</label><textarea id="input" maxlength="40000" placeholder="We invite you to co-create more-than-human futures through embodied practices of collective care…" spellcheck="false"></textarea>
<div class="actions"><button id="check" class="primary">Check my text ↗</button><button id="example" class="secondary">Try an example</button><button id="clear" class="text-button">Clear</button></div>
<p class="small">Up to 40,000 characters. Your text stays in this browser.</p>
</section>
<div id="notice" role="status" class="notice"></div>

</div>
<div class="bingo-wrap">
<div class="card-heading"><h2>HOPECORE<br><span>BINGO</span></h2><div class="counter"><strong id="count">0</strong><span>/ 24 tropes</span></div></div>
<div class="bingo-letters" aria-hidden="true"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
<div id="board" class="board" aria-label="Hopecore bingo card"></div>
<div class="card-footer"><span id="bingo-status" role="status">The future is unmarked.</span><span>Click a square for receipts ↗</span></div>
<div id="evidence" class="evidence" aria-live="polite"><p>Select a square to inspect its language.</p></div>
</div>
</section>
</main>

<div id="celebration" aria-hidden="true"></div>
</body></html>
